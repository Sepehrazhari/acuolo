<style>
:root{
  --muted:var(--text-muted); --light:var(--text-light);
  --display:var(--font-display); --body:var(--font-body);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--linen);color:var(--anvil);font-family:var(--body)}
.wrap{max-width:780px;margin:0 auto;padding:28px 18px 60px}
.backlink{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--muted);text-decoration:none;margin-bottom:14px}
.backlink:hover{color:var(--coral)}
.brandbar{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.mark{width:26px;height:26px;border-radius:7px;background:var(--coral);display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--display);font-weight:700;font-size:14px}
.brand{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:-.3px}
.tag{margin-left:auto;font-size:12px;color:var(--muted)}
h1{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:-.6px;margin:8px 0 20px}
.prog{display:flex;gap:6px;margin-bottom:22px}
.prog div{flex:1}
.bar{height:4px;border-radius:4px;background:var(--border)}
.bar.on{background:var(--coral)}
.plab{font-size:11px;margin-top:6px;color:var(--light)}
.plab.on{color:var(--anvil);font-weight:500}
.card{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:26px}
@keyframes stepIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.card.step-anim{animation:stepIn .3s ease}
.sec{margin-bottom:26px}
.lab{font-family:var(--display);font-weight:700;font-size:15px}
.hint{font-size:13px;color:var(--muted);margin-top:2px;margin-bottom:10px}
.chip{font-family:var(--body);font-size:14px;padding:9px 14px;border-radius:100px;border:1.5px solid var(--border);
  background:#fff;color:var(--anvil);cursor:pointer;margin:0 8px 8px 0;transition:all .15s}
.chip:hover{border-color:var(--coral)}
.chip.on{background:var(--coral);border-color:var(--coral);color:#fff;font-weight:500}
input[type=text]{font-family:var(--body);font-size:15px;width:100%;padding:11px 14px;border-radius:10px;border:1.5px solid var(--border);outline:none}
input[type=text]:focus{border-color:var(--coral)}
.scard{display:block;width:100%;text-align:left;cursor:pointer;padding:14px 16px;border-radius:12px;border:1.5px solid var(--border);background:#fff;margin-bottom:10px;transition:border-color .15s,background .15s}
.scard.on{border-color:var(--coral);background:var(--coral-light)}
.scard b{font-family:var(--display);font-size:15px;display:block}
.scard span{font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 24px;margin-top:14px}
.k{font-size:11px;color:var(--light);text-transform:uppercase;letter-spacing:.4px}
.v{font-size:14px;margin-top:2px}
.nav{display:flex;justify-content:space-between;margin-top:8px;gap:10px}
.disclose{font-size:12.5px;color:var(--light);line-height:1.55;margin:16px 0 2px}
.btn{font-family:var(--body);font-size:14px;padding:11px 20px;border-radius:100px;border:1.5px solid var(--border);
  background:#fff;color:var(--anvil);cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--anvil)}
.btn.dark{background:var(--anvil);color:#fff;border-color:var(--anvil);font-weight:500}
.btn.coral{background:var(--coral);color:#fff;border-color:var(--coral);font-weight:500}
.btn:disabled{opacity:.45;cursor:default}
.note{font-size:13px;background:var(--coral-light);color:var(--coral-dark);padding:10px 14px;border-radius:10px;margin-bottom:18px;line-height:1.5}
.fhead{border-bottom:2px solid var(--anvil);padding-bottom:14px;margin-bottom:18px}
.eyebrow{font-size:12px;color:var(--coral);font-weight:500;letter-spacing:.5px;text-transform:uppercase}
.ftitle{font-family:var(--display);font-weight:700;font-size:22px;margin-top:4px}
.fmeta{font-size:13px;color:var(--muted);margin-top:3px}
.intro{font-size:14.5px;line-height:1.6;margin:0 0 20px}
.h2{font-family:var(--display);font-weight:700;font-size:17px;margin:30px 0 10px;padding-top:16px;border-top:2px solid var(--anvil)}
.h2:first-of-type{border-top:none;padding-top:0}
.loop{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.loopstep{flex:1 1 130px;border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:var(--linen)}
.loopstep b{display:block;font-family:var(--display);font-size:13.5px}
.loopstep span{font-size:12px;color:var(--muted)}
.checklist{background:var(--teal-light);border-radius:12px;padding:14px 16px;margin-bottom:18px;font-size:13.5px;line-height:1.7}
.checklist b.t{font-family:var(--display);font-size:13px;display:block;margin-bottom:6px}
.checklist div{display:flex;gap:8px;align-items:flex-start}
.box{width:13px;height:13px;border:1.5px solid var(--muted);border-radius:3px;flex-shrink:0;margin-top:4px}
.stage{margin-bottom:24px;padding-bottom:4px}
.stagehead{font-family:var(--display);font-weight:700;font-size:16px}
.snum{color:var(--coral)}
.stagemeta{font-size:12.5px;color:var(--light);margin-top:2px}
.stagepurpose{font-size:13.5px;color:var(--muted);line-height:1.6;margin-top:6px;margin-bottom:4px}
.qc{padding:12px 0;border-top:1px solid var(--border)}
.qcname{font-weight:700;font-size:14px}
.qcdef{font-size:12.5px;color:var(--muted);font-style:italic;margin-top:1px}
.qlist{margin:8px 0 0;padding-left:18px;font-size:14px;line-height:1.65}
.qlist li{margin-bottom:9px}
.probe{display:block;font-size:13px;color:var(--muted);margin-top:4px;padding-left:10px;border-left:2px solid var(--border)}
.probe b{font-family:var(--display);font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--coral-dark)}
.sig{font-size:12.5px;line-height:1.6;margin-top:8px}
.sig b{font-family:var(--display);font-size:12px}
.sig .good{color:var(--teal)}
.sig .bad{color:var(--coral-dark)}
.scale{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.pill{font-size:12px;color:var(--muted);border:1px solid var(--border);border-radius:8px;padding:5px 9px}
.rubric{background:var(--linen);border-radius:12px;padding:16px 18px;font-size:13.5px;line-height:1.7}
.rubric b.t{font-family:var(--display);font-size:14px;display:block;margin-bottom:8px}
.rubric ul{margin:6px 0 0;padding-left:18px}
.rubric li{margin-bottom:5px}
.email{border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:12px;background:#fff}
.emailname{font-family:var(--display);font-weight:700;font-size:14px}
.emailwhen{font-size:12px;color:var(--light);margin-top:1px;margin-bottom:8px}
.emailsubj{font-size:13px;background:var(--linen);border-radius:7px;padding:7px 10px;margin-bottom:8px}
.emailbody{font-size:13.5px;line-height:1.65;white-space:pre-wrap}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px;padding-top:20px;border-top:1px solid var(--border)}
.studio{margin-top:22px;padding:18px 20px;border:1.5px solid var(--coral);border-radius:14px;background:var(--coral-light)}
.studio b{font-family:var(--display);font-size:15px;display:block;margin-bottom:5px;color:var(--coral-dark)}
.studio p{margin:0 0 13px;font-size:13.5px;line-height:1.6;color:var(--anvil)}
.studio a{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:500;color:#fff;background:var(--coral);padding:10px 18px;border-radius:100px;text-decoration:none}
.studio a:hover{opacity:.92}
.foot{text-align:center;font-size:12px;color:var(--light);margin-top:16px}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
</style>

<script>
/* ============================================================
   CONTENT LIBRARY
   Deterministic, built in so the demo runs with no network at all.
   Every question is situational: a scenario the candidate reasons
   through, not a request to recount or demonstrate past work. Each
   scenario carries an escalation probe that adds a constraint, which
   is where a rehearsed answer separates from real judgement.
   ============================================================ */
var COMP = {
  "Communication":{def:"Shares information clearly and listens well.",
    sc:[{s:"You need to present a decision your team made to a group who do not share your background and are sceptical about it. Part-way through, you can see the room is not with you. What do you do?",
         p:"Say you have ten minutes left and two options — push on and finish, or stop and restart from their questions. How would you choose between them?"},
        {s:"A colleague in another team acts on something you wrote and does close to the opposite of what you intended. You find out a week later, after the work is done. What do you do?",
         p:"What would you want to understand about how the misunderstanding happened before deciding what to change?"}],
    strong:["Adapts the explanation to the audience rather than restating it more slowly.","Wants to know where the message broke down before fixing anything."],
    weak:["Every answer is 'send more detail' or 'write it down better'.","Treats being misunderstood as the listener's failure."]},

  "Collaboration":{def:"Works with others toward a shared outcome.",
    sc:[{s:"You depend on another team to hit a shared deadline, and their handoffs keep arriving late. Your part is now at risk. What do you do?",
         p:"There are a few routes: talk to the person, talk to their lead, change how the handoff works, or absorb it yourself. How would you decide which to try first, and what would make you switch to another?"},
        {s:"In a meeting with senior people present, a teammate presents work that was largely yours as their own. What do you do?",
         p:"What would you want to understand about why it happened before you decide how to respond?"}],
    strong:["Picks the lightest intervention that could work, and knows what would make them escalate.","Separates the outcome that matters from the credit that does not."],
    weak:["Only has one move — either go straight to a manager, or say nothing at all.","Assumes bad intent without checking."]},

  "Ownership & accountability":{def:"Takes responsibility for outcomes, not just tasks.",
    sc:[{s:"You find a mistake in work you delivered three weeks ago. Nobody has noticed yet. Fixing it properly costs the team about a week. What do you do?",
         p:"How would you work out how urgent it actually is, and how would you present it so the team can make a good decision rather than just react?"},
        {s:"A project you are on is going to miss its date because something you depend on slipped. What do you do?",
         p:"Say the realistic options are moving the date, cutting scope, or adding people. What would you need to know to recommend one, and which would you argue for?"}],
    strong:["Brings the problem with options and a recommendation, not just the bad news.","Separates owning the outcome from having caused it."],
    weak:["Weighs the discomfort of raising it above the cost of it staying broken.","Stops at whose fault it was."]},

  "Technical excellence":{def:"Delivers high-quality, durable work.",
    sc:[{s:"You are asked to deliver something in noticeably less time than you would normally want. You could hit the date by taking shortcuts that will not be visible for months. What do you do?",
         p:"If you did take some shortcuts, how would you decide which ones are safe to take, and how would you make sure they are not quietly forgotten?"},
        {s:"You inherit work from someone who has left. It functions, but it is fragile and you do not fully understand it. A change is needed next week. How do you approach it?",
         p:"You find something that looks like it has been causing problems quietly for a while. How do you decide between fixing that now and shipping the change first?"}],
    strong:["Distinguishes shortcuts that can be paid back from ones that compound.","Makes the cost visible to the people who will live with it."],
    weak:["Either refuses the constraint outright or accepts it without naming what it costs.","Quality is described as effort rather than as a set of decisions."]},

  "Problem solving":{def:"Breaks down hard problems and finds workable answers.",
    sc:[{s:"Something is going wrong intermittently and nobody can reproduce it. Two people have already looked without success. It comes to you. Where do you start?",
         p:"Two days in, you are no closer. How would you decide between keeping going, changing approach, and bringing someone else in?"},
        {s:"Part-way into a task you become convinced the real problem is somewhere else entirely, outside what you were asked to look at. What do you do?",
         p:"How would you test whether you are right before raising it, and what would change your mind?"}],
    strong:["Narrows the problem before reaching for solutions.","Can say what evidence would prove them wrong."],
    weak:["Repeats the same approach with more effort.","Certainty is not connected to any evidence."]},

  "Leadership & influence":{def:"Moves people and work forward without relying on authority.",
    sc:[{s:"You think the team is about to make a decision that will not work. You have no authority over it. What do you do?",
         p:"You make your case and the team decides to go the other way anyway. What is your role from that point?"},
        {s:"You are leading a piece of work and one person is not delivering what was agreed. Others have noticed. What do you do?",
         p:"In the conversation they tell you something outside work is affecting them. How does that change what you do next — both for them and for the deadline?"}],
    strong:["Commits to a decision they argued against, without withdrawing.","Handles the person directly and privately before it becomes a group problem."],
    weak:["Disengages once the decision goes against them.","Treats the personal disclosure as either irrelevant or as a reason to do nothing."]},

  "Adaptability":{def:"Adjusts well when priorities or conditions change.",
    sc:[{s:"You are a week from finishing a two-month project when priorities shift and it is shelved. Something else starts on Monday. What do you do?",
         p:"You think shelving it was the wrong call. How would you make that case, and how do you separate making it from getting on with the new work?"},
        {s:"Half-way through an approach you personally argued for, evidence appears that it is not working. What do you do?",
         p:"How much evidence would you want before changing course? What is the cost of switching too early, against switching too late?"}],
    strong:["Separates disagreeing with a decision from undermining it.","Can name a threshold for changing their mind rather than deciding by feel."],
    weak:["Treats every change of direction as somebody else's mistake.","Defends the original position past the point the evidence supports it."]},

  "Customer focus":{def:"Keeps the customer's real needs central.",
    sc:[{s:"A customer asks for a specific feature. You think it will not solve the problem underneath it. Building what they asked for is quick; the better fix is slow. What do you do?",
         p:"How much should the size of that customer change your answer? Talk me through it."},
        {s:"You discover an issue affecting a small number of customers. None have complained and they may never notice. What do you do?",
         p:"How would you weigh telling them against the disruption of raising something they have not noticed? What would tip it either way?"}],
    strong:["Goes after the problem behind the request before agreeing or refusing.","Reasons about commercial weight openly instead of pretending it is irrelevant."],
    weak:["Defaults to whatever the customer said, or overrides them without asking.","Account size silently decides it."]},

  "Strategic thinking":{def:"Connects daily work to longer-term direction.",
    sc:[{s:"You have capacity for one of two things. One is clearly useful this quarter. The other is larger but only pays off in about a year. Which do you argue for, and how?",
         p:"What would you need to know about where the company is right now to be confident in that answer?"},
        {s:"A request arrives that is easy to say yes to and does not obviously serve your team's goals. What do you do?",
         p:"If you wanted to say no, how would you do it so the relationship stays good and the door stays open?"}],
    strong:["Answer changes depending on the company's situation, and they say which way.","Says no with a reason and an alternative attached."],
    weak:["Chooses on what is easiest or most visible.","Cannot connect the choice to anything the company is trying to achieve."]},

  "Feedback & growth":{def:"Gives and receives feedback that leads to change.",
    sc:[{s:"Someone on your team does good work but regularly talks over people in meetings. Nobody has mentioned it. You have noticed. What do you do?",
         p:"You raise it and they do not see it the same way. Where do you take it from there?"},
        {s:"In a review you are given feedback you believe is factually wrong. What do you do in the moment, and afterwards?",
         p:"Looking into it, you find part of it was fair and part was not. How do you handle the follow-up conversation?"}],
    strong:["Gives it directly and privately, close to the event.","Can hold 'partly right' without collapsing it into right or wrong."],
    weak:["Routes the feedback through a manager instead of giving it.","Disagreement in the moment becomes silence afterwards."]},

  "Reliability":{def:"Consistent and dependable in day-to-day delivery.",
    sc:[{s:"You have committed to three things this week and it becomes clear you can do two of them well. What do you do?",
         p:"Each was promised to a different person and all three matter to them. How would you approach those conversations, and what would you offer instead?"},
        {s:"You are given a six-week piece of work with no check-ins scheduled and nobody expecting an update until the end. How do you run it?",
         p:"At week four you realise you are behind. What do you do, and what do you wish you had set up in week one?"}],
    strong:["Renegotiates early and explicitly rather than quietly letting quality slip.","Creates their own checkpoints when nobody imposes them."],
    weak:["Absorbs the overload silently and hopes it works out.","The slip only becomes visible at the deadline."]},

  "Innovation":{def:"Improves how things are done, not just what.",
    sc:[{s:"You think there is a better way to do something the team has done the same way for a long time. Trying it costs time and may not work. How do you proceed?",
         p:"You run a small trial and the results come back mixed. How do you decide between continuing, adjusting, and dropping it?"},
        {s:"You are asked to follow a process you believe produces worse outcomes. What do you do?",
         p:"How would you make the case for changing it, and what evidence would you want to bring with you?"}],
    strong:["Proposes something small and reversible rather than a wholesale change.","Says in advance what would count as it not working."],
    weak:["Wants to change things with no way of telling whether it helped.","Either complies silently or works around the process alone."]}
};

var ROLE_MAP = {
  "Software Engineering":["Technical excellence","Problem solving","Collaboration","Communication","Ownership & accountability"],
  "Product & Design":["Customer focus","Communication","Collaboration","Problem solving","Strategic thinking"],
  "Sales":["Customer focus","Communication","Ownership & accountability","Adaptability","Reliability"],
  "Marketing":["Communication","Innovation","Customer focus","Collaboration","Ownership & accountability"],
  "Operations":["Reliability","Problem solving","Ownership & accountability","Collaboration","Adaptability"],
  "People & HR":["Communication","Feedback & growth","Collaboration","Reliability","Customer focus"],
  "Customer Success":["Customer focus","Communication","Reliability","Problem solving","Ownership & accountability"],
  "Finance":["Reliability","Problem solving","Communication","Ownership & accountability","Strategic thinking"],
  "Leadership (General)":["Leadership & influence","Strategic thinking","Communication","Feedback & growth","Ownership & accountability"]
};

var STAGE_META = {
  "Screen":{dur:"30 min",who:"Recruiter or hiring manager",
    purpose:"Confirm the must-haves, motivation, and basic communication. This stage is cheap to run, so use it to rule out early rather than to sell.",
    affinity:["Communication","Reliability"]},
  "Skills":{dur:"60 min",who:"Someone who does this job, plus the hiring manager",
    purpose:"Watch them do a version of the work. This is the one stage HR does not write — the task comes from your own specialist. What HR owns is that it is the same task for everyone and scored on the same scale.",
    affinity:["Technical excellence","Problem solving","Innovation"]},
  "Team fit":{dur:"45 min",who:"Two people who would work with them weekly",
    purpose:"How they operate with other people day to day. Not whether you would enjoy a drink with them, which is how teams end up hiring the same person repeatedly.",
    affinity:["Collaboration","Feedback & growth","Adaptability"]},
  "Values":{dur:"45 min",who:"Someone outside the hiring team",
    purpose:"Values alignment and ownership, run by someone with no stake in filling the seat quickly.",
    affinity:["Ownership & accountability","Customer focus"]},
  "Final":{dur:"45 min",who:"Department lead or founder",
    purpose:"Scope, judgement, and whether the role is big enough to keep them for two years. Also their chance to interview you.",
    affinity:["Strategic thinking","Leadership & influence"]}
};

var STAGE_CORE = {
  "Skills":{name:"Brief for whoever runs this stage",
    note:"The content of this stage is designed by someone who actually does this job — not by HR, and not by us. A generic technical question is worse than no technical question. What follows is the structure HR owns around it.",
    guidance:["Give the interviewer the competencies listed below and ask them to design one task that surfaces them. They pick the task; you keep the standard.",
      "Every candidate for this role gets the same task. A bespoke exercise per candidate makes them impossible to compare, which is the whole point of the scale.",
      "Time-box it, and tell the candidate in advance what format to expect and whether they need to prepare anything.",
      "Require a written score on the same 1-4 scale below, submitted before the debrief — not a verbal impression afterwards.",
      "If the interviewer cannot say which competency a question was testing, it does not belong in the stage."]},
  "Screen":{name:"Motivation & basics",
    note:"Not scored, and deliberately not scenarios — these are about their actual situation, which no hypothetical can stand in for. Keep it to a few minutes; do not let it become a CV walkthrough.",
    q:["Why this role, and why now?",
       "What do you want to be different about your next job?"]},
  "Team fit":{name:"Working together",note:"Use when no named competency is assigned to this stage.",
    sc:[{s:"You join a team whose way of working does not suit you — the meeting rhythm, how decisions get made, how much gets written down. What do you do in your first month?",
         p:"You suggest a change and the team is lukewarm about it. How do you decide between pushing, adapting, and leaving it for later?"},
        {s:"A colleague criticises your work in front of others and you think the criticism is unfair. What do you do in the moment?",
         p:"Afterwards you think part of it was fair. How do you handle the follow-up?"},
        {s:"You are paired with someone whose working style is the opposite of yours on a six-week project. How do you set up the first week?",
         p:"Three weeks in it is not working smoothly. What would you change, and how would you raise it with them?"}]},
  "Values":{name:"Judgement & ownership",note:"Use when no named competency or stated value is assigned to this stage.",
    sc:[{s:"You are asked to do something that is not wrong exactly, but sits uncomfortably with you. What do you do?",
         p:"How would you raise it in a way that is likely to be heard rather than brushed past?"},
        {s:"You spot something that is technically within the rules but arguably against the spirit of them. What do you do?",
         p:"How do you decide when the spirit matters more than the letter? Where would you draw that line?"},
        {s:"There is a faster route to a result that carries a small risk. How would you think it through?",
         p:"Who should make that call, and what would you want them to know before they did?"}]}
};

var LOOPS = [
  {v:"Lean",l:"Lean · 3 stages",stages:["Screen","Skills","Final"]},
  {v:"Standard",l:"Standard · 4 stages",stages:["Screen","Skills","Team fit","Final"]},
  {v:"Thorough",l:"Thorough · 5 stages",stages:["Screen","Skills","Team fit","Values","Final"]}
];

var RATING = [["1","Strong no"],["2","No"],["3","Yes"],["4","Strong yes"]];

var EMAIL_GROUPS = ["Sourcing & outreach","Scheduling & progress","Holds & rejections","Offer"];

var ROLES=Object.keys(ROLE_MAP);
var COMPS=Object.keys(COMP);
var SENIORITY=["IC - Junior","IC - Senior","Team Lead","Manager","Director / Exec"];
var TONES=["Professional","Warm","Direct"];
var STEPS=["Basics","What to assess","Interview loop","Communications","Review"];

/* ============================ STATE ============================ */
var S={step:0,kit:null,copied:false,cfg:{
  company:"",role:"Software Engineering",seniority:"IC - Senior",
  autoComp:true,comps:[],values:"",musts:"",
  loop:"Standard",emailGroups:EMAIL_GROUPS.slice(),tone:"Professional"
}};

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}

function splitList(s,cap){
  return String(s||"").split(",").map(function(v){return v.trim();}).filter(Boolean).slice(0,cap);
}

/* ==================== EMAIL TEMPLATES ==================== */
function buildEmails(cfg){
  var co = cfg.company || "our team";
  var role = cfg.role;
  var warm = cfg.tone==="Warm", direct = cfg.tone==="Direct";
  var signoff = warm ? "Looking forward to hearing from you,\n[Your name]" : direct ? "[Your name]" : "Best,\n[Your name]";

  var out = [];

  if(cfg.emailGroups.indexOf("Sourcing & outreach")>-1){
    out.push({group:"Sourcing & outreach",name:"LinkedIn cold outreach",when:"You found them. First contact, nothing sent yet.",
      subj:"(LinkedIn message, no subject line)",
      body:"Hi [Candidate name],\n\nI came across your profile and the "+
        "[specific thing they did] stood out — that is close to the work we have open on the "+role+" side at "+co+".\n\n"+

        "Worth a short conversation?\n\n"+signoff});

      subj:"(LinkedIn reply, no subject line)",
      body:"Hi [Candidate name],\n\nThanks for reaching out, and for the context on what you are looking for.\n\n"+
        "We do have a "+role+" role open at "+co+". Based on what you have described, the closest fit is [role or level] — I have put the full details here: [link].\n\n"+
        "If it looks right, the next step is a "+(cfg.loop==="Lean"?"short screen":"30-minute screen")+" with me. If it does not, tell me and I will keep you in mind for what comes next.\n\n"+signoff});

    out.push({group:"Sourcing & outreach",name:"Website / inbound application acknowledgement",when:"They applied through your site. Send within 24 hours.",
      subj:"Your application for "+role+" at "+co,
      body:"Hi [Candidate name],\n\nThanks for applying for the "+role+" role — your application is in and a real person is reading it, not just a filter.\n\n"+
        "You will hear from us by [date] either way. If we are moving forward, the first step is a "+STAGE_META.Screen.dur+" conversation.\n\n"+
        "If you have questions in the meantime, reply here.\n\n"+signoff});

    out.push({group:"Sourcing & outreach",name:"Reach out after reviewing their CV",when:"They applied, you read the CV, you want to talk.",
      subj:"Your application for "+role+" at "+co,
      body:"Hi [Candidate name],\n\nI read your CV properly — the [specific project or experience] is the part that made me want to talk.\n\n"+
        "I would like to set up a "+STAGE_META.Screen.dur+" call to cover what the role actually involves and hear how you are thinking about your next move.\n\n"+
        "Here are a few times that work: [times]. If none suit, send me what does.\n\n"+signoff});
  }

  if(cfg.emailGroups.indexOf("Scheduling & progress")>-1){
    out.push({group:"Scheduling & progress",name:"Interview invitation",when:"Use for any stage. Swap in the stage name and interviewers.",
      subj:"["+role+"] Next step: [stage name]",
      body:"Hi [Candidate name],\n\nGood news — we would like to move you to the [stage name] stage.\n\n"+
        "Format: [duration] with [interviewer names and roles].\nFocus: [what this stage assesses].\n"+
        "To prepare: [what to bring, or 'nothing — come as you are'].\n\n"+
        "Times available: [times].\n\n"+
        "If you need anything to do your best in this conversation — a different time, materials in advance, adjustments of any kind — just say so.\n\n"+signoff});

    out.push({group:"Scheduling & progress",name:"Stage passed, moving forward",when:"They cleared a stage and the next one is scheduled.",
      subj:"["+role+"] You are through to [next stage]",
      body:"Hi [Candidate name],\n\nThe team enjoyed the conversation and we would like to keep going.\n\n"+
        "What stood out: [one specific, true thing].\n\n"+
        "Next is [next stage] — [duration] with [names]. I will send times shortly.\n\n"+
        "We have [number] stages left in total, so you know where you stand.\n\n"+signoff});
  }

  if(cfg.emailGroups.indexOf("Holds & rejections")>-1){
    out.push({group:"Holds & rejections",name:"Process paused / on hold",when:"Budget, reorg, or priorities changed mid-process. Send it — do not go quiet.",
      subj:"["+role+"] An honest update",
      body:"Hi [Candidate name],\n\nI want to be straight with you rather than leave you guessing: we have paused the "+role+" search because [real reason — budget, reprioritisation, internal change].\n\n"+
        "This is not about your candidacy. You were [where they actually stood].\n\n"+
        "Realistic timeline: I expect to know more by [date]. If your situation changes before then, tell me and I will tell you honestly whether it is worth waiting.\n\n"+
        "Sorry to interrupt the momentum.\n\n"+signoff});

    out.push({group:"Holds & rejections",name:"Rejection — application or screen stage",when:"Early exit. Keep it short and prompt; do not let it sit.",
      subj:"["+role+"] Update on your application",
      body:"Hi [Candidate name],\n\nThank you for the time you put into this. We are not moving forward with your application for the "+role+" role.\n\n"+
        "The deciding factor was [specific, honest gap — not 'we went with someone more suitable'].\n\n"+
        "That is a comment on the fit for this particular role, nothing more. If [that gap] changes, I would genuinely welcome another application.\n\n"+signoff});

    out.push({group:"Holds & rejections",name:"Rejection — after final interview",when:"They invested hours. This one gets written individually, never bulk-sent.",
      subj:"["+role+"] Our decision",
      body:"Hi [Candidate name],\n\nThis is a harder email to write than the usual one. We have decided not to make you an offer for the "+role+" role.\n\n"+
        "You got to the final stage out of [number] candidates, which is a real result. What the team valued: [two specific things].\n\n"+
        "The decision came down to [specific differentiator]. That is a narrow gap, not a verdict on your ability.\n\n"+
        "If you want the detailed feedback from each interviewer, reply and I will send it — most people do not ask and I think that is a waste.\n\n"+
        "I would like to stay in touch about future roles, if you are open to that.\n\n"+signoff});
  }

  if(cfg.emailGroups.indexOf("Offer")>-1){
    out.push({group:"Offer",name:"Offer",when:"Call them first. This is the written confirmation, not the news.",
      subj:"["+role+"] Your offer from "+co,
      body:"Hi [Candidate name],\n\nGreat speaking just now — putting it in writing as promised.\n\n"+
        "Role: "+role+" ("+cfg.seniority+")\nStart date: [date]\nCompensation: [amount and structure]\n"+
        "Reporting to: [name]\nOther terms: [holiday, remote policy, equity, whatever applies]\n\n"+
        "Formal paperwork is attached. Take until [date] to decide — and if you want to talk any of it through, including the parts that are negotiable, I would rather have that conversation than have you accept something you are unsure about.\n\n"+
        "The team is genuinely glad this worked out.\n\n"+signoff});
  }

  return out;
}

/* ==================== GENERATION (deterministic) ==================== */
function buildKit(cfg){
  var names;
  if(!cfg.autoComp && cfg.comps.length){ names=cfg.comps.slice(0,7); }
  else{
    names=(ROLE_MAP[cfg.role]||COMPS.slice(0,5)).slice();
    if(cfg.seniority==="Team Lead"||cfg.seniority==="Manager"){
      ["Leadership & influence","Feedback & growth"].forEach(function(n){ if(names.indexOf(n)===-1) names.push(n); });
    }
    if(cfg.seniority==="Director / Exec"){
      ["Leadership & influence","Strategic thinking"].forEach(function(n){ if(names.indexOf(n)===-1) names.push(n); });
    }
    names=names.slice(0,6);
  }

  var stageNames=(LOOPS.filter(function(l){return l.v===cfg.loop;})[0]||LOOPS[1]).stages;
  var values=splitList(cfg.values,4);
  var musts=splitList(cfg.musts,6);

  // Assign each competency to the stage whose focus it best matches;
  // anything left over is spread across stages round-robin.
  var assigned={}; stageNames.forEach(function(s){ assigned[s]=[]; });
  var unplaced=[];
  names.forEach(function(n){
    var target=null;
    for(var i=0;i<stageNames.length;i++){
      if((STAGE_META[stageNames[i]].affinity||[]).indexOf(n)>-1){ target=stageNames[i]; break; }
    }
    if(target) assigned[target].push(n); else unplaced.push(n);
  });
  var ri=0;
  unplaced.forEach(function(n){
    // prefer a stage that has nothing yet, otherwise round-robin
    var empty=stageNames.filter(function(s){return assigned[s].length===0;});
    var target = empty.length ? empty[0] : stageNames[ri++ % stageNames.length];
    assigned[target].push(n);
  });
  // If a stage ended up empty, give it a competency nobody else is covering.
  // Never duplicate one that another stage already assesses — a repeated
  // competency wastes the stage and tells you nothing new.
  stageNames.forEach(function(s){
    if(assigned[s].length) return;
    var used={}; stageNames.forEach(function(x){ assigned[x].forEach(function(n){ used[n]=1; }); });
    var spare=names.filter(function(n){ return !used[n]; });
    if(spare.length) assigned[s].push(spare[0]);
  });

  var valueStage = stageNames.indexOf("Values")>-1 ? "Values" : stageNames[stageNames.length-1];

  var stages=stageNames.map(function(sn,i){
    var meta=STAGE_META[sn];
    var comps=assigned[sn].map(function(n){
      return {name:n, definition:COMP[n].def, scenarios:COMP[n].sc,
              strong:COMP[n].strong, weak:COMP[n].weak};
    });
    var valueQs=[];
    if(values.length && sn===valueStage){
      values.forEach(function(v){
        var lv=v.toLowerCase();
        valueQs.push({s:"Suppose acting on "+lv+" in a particular situation would cost something real — time, a deadline, or a result that would have looked good. How would you think that through?",
                      p:"Where is the line for you? What would make you decide the cost was too high to be worth it?"});
        valueQs.push({s:"Describe a situation in this role where "+lv+" and moving quickly would pull in different directions. How would you handle it?",
                      p:"How would you explain that decision to a colleague who weighed it the other way?"});
      });
    }
    // The final conversation is a different kind of interview: scope, motivation,
    // and their questions for you. It gets its own block regardless of competencies.
    var closing = sn==="Final" ? [
      "What would need to be true two years from now for you to say this was the right move?",
      "Which part of this role are you least sure about?",
      "What do you want to ask us?"
    ] : [];
    // Every stage needs substance of its own, whether or not a competency
    // happened to land on it.
    var core=null;
    if(sn==="Screen") core=STAGE_CORE.Screen;
    else if(sn==="Skills") core=STAGE_CORE.Skills;
    else if(sn==="Team fit" && !comps.length) core=STAGE_CORE["Team fit"];
    else if(sn==="Values" && !comps.length && !valueQs.length) core=STAGE_CORE.Values;

    return {name:sn, num:i+1, duration:meta.dur, who:meta.who, purpose:meta.purpose,
            core:core, competencies:comps, valueQuestions:valueQs, closing:closing};
  });

  var intro="This is the hiring kit for the "+cfg.seniority+" "+cfg.role+" role"+(cfg.company?" at "+cfg.company:"")+
    ". Every candidate goes through the same stages, gets asked about the same competencies, and is scored on the same scale. "+
    "That is the entire point: structured interviews predict performance considerably better than unstructured ones, mostly because they stop each interviewer from quietly assessing something different. "+
    "Every question here is a scenario. Candidates are not asked to recount their CV or to present work they prepared earlier — they are put in a situation and asked what they would do. Preparation and polish stop being an advantage; reasoning is what shows."+
    (stageNames.indexOf("Skills")>-1
      ? " One division of labour worth being explicit about: these scenarios are behavioural and values-based, which is HR's ground and generalises across companies. The role-specific assessment in the Skills stage is designed by your own specialist, because a generic technical question tells you less than no technical question. This kit gives that stage its structure, not its content."
      : "");

  return {intro:intro, stages:stages, values:values, musts:musts, emails:buildEmails(cfg), competencyCount:names.length};
}

/* ============================ RENDER ============================ */
var app=document.getElementById("app");

function chips(list,key,multi){
  return list.map(function(o){
    var val=typeof o==="object"?o.v:o, lab=typeof o==="object"?o.l:o;
    var on=multi?S.cfg[key].indexOf(val)>-1:S.cfg[key]===val;
    return '<button class="chip'+(on?" on":"")+'" data-act="'+(multi?"tog":"set")+'" data-k="'+key+'" data-v="'+esc(val)+'">'+
      (multi&&on?"&#10003; ":"")+esc(lab)+'</button>';
  }).join("");
}

function render(){
  var c=S.cfg,h="";

  if(S.step<5){
    h+='<div class="prog">'+STEPS.map(function(s,i){
      return '<div><div class="bar'+(i<=S.step?" on":"")+'"></div><div class="plab'+(i===S.step?" on":"")+'">'+s+'</div></div>';
    }).join("")+'</div>';
  }

  h+='<div class="card">';

  if(S.step===0){
    h+='<div class="sec"><div class="lab">Team or company name</div><div class="hint">Appears in the kit and in the email templates. Optional.</div>'+
       '<input type="text" id="company" value="'+esc(c.company)+'" placeholder="e.g. Fakir Technology"></div>';
    h+='<div class="sec"><div class="lab">Role you are hiring for</div><div class="hint">Tailors the competencies and questions.</div>'+chips(ROLES,"role")+'</div>';
    h+='<div class="sec"><div class="lab">Seniority level</div><div class="hint">A junior and a director are interviewed for different things.</div>'+chips(SENIORITY,"seniority")+'</div>';
  }

  if(S.step===1){
    h+='<div class="sec"><div class="lab">Competencies to assess</div><div class="hint">Pick automatically for this role, or choose your own.</div>'+
       '<button class="chip'+(c.autoComp?" on":"")+'" data-act="set" data-k="autoComp" data-v="1">Auto - pick for this role</button>'+
       '<button class="chip'+(!c.autoComp?" on":"")+'" data-act="set" data-k="autoComp" data-v="">I will choose</button>';
    if(!c.autoComp){ h+='<div style="margin-top:14px">'+chips(COMPS,"comps",true)+'</div>'; }
    h+='</div>';
    h+='<div class="sec"><div class="lab">Your core values</div><div class="hint">Comma separated. Each one gets its own interview questions, so candidates are actually assessed against them rather than just shown them.</div>'+
       '<input type="text" id="values" value="'+esc(c.values)+'" placeholder="e.g. Candor, Ownership, Craft"></div>';
    h+='<div class="sec"><div class="lab">Must-have requirements</div><div class="hint">Comma separated. Becomes a screening checklist — the things that are genuinely non-negotiable, not the wish list.</div>'+
       '<input type="text" id="musts" value="'+esc(c.musts)+'" placeholder="e.g. Works CET hours, Fluent German, 3+ years in B2B SaaS"></div>';
  }

  if(S.step===2){
    h+='<div class="sec"><div class="lab">Interview loop</div><div class="hint">Your competencies get spread across these stages so interviewers are not all asking the same questions.</div>';
    LOOPS.forEach(function(l){
      h+='<button class="scard'+(c.loop===l.v?" on":"")+'" data-act="set" data-k="loop" data-v="'+l.v+'">'+
         '<b>'+esc(l.l)+'</b><span>'+l.stages.join(" · ")+'</span></button>';
    });
    h+='</div>';
  }

  if(S.step===3){
    h+='<div class="sec"><div class="lab">Email templates to include</div><div class="hint">Every point where a candidate is waiting to hear from you.</div>'+
       chips(EMAIL_GROUPS,"emailGroups",true)+'</div>';
    h+='<div class="sec"><div class="lab">Tone</div><div class="hint">Affects how the emails are written.</div>'+chips(TONES,"tone")+'</div>';
  }

  if(S.step===4){
    var kv=[["Company",c.company||"-"],["Role",c.role],["Seniority",c.seniority],
      ["Competencies",(c.autoComp||!c.comps.length)?"Auto (picked for role)":c.comps.join(", ")],
      ["Core values",splitList(c.values,4).join(", ")||"-"],
      ["Must-haves",splitList(c.musts,6).join(", ")||"-"],
      ["Interview loop",(LOOPS.filter(function(l){return l.v===c.loop;})[0]||LOOPS[1]).l],
      ["Emails",c.emailGroups.join(", ")||"None"],["Tone",c.tone]];
    h+='<div class="lab">Review your setup</div><div class="hint">Step back to change anything.</div><div class="grid">'+
       kv.map(function(p){return '<div><div class="k">'+p[0]+'</div><div class="v">'+esc(p[1])+'</div></div>';}).join("")+'</div>';
  }

  if(S.step===5&&S.kit){ h+=resultHTML(c,S.kit); }

  if(S.step<5){
    if(S.step===4){ h+='<div class="disclose">When you generate, a copy of the document and the choices you made are sent to the Acuolo team so we can see which tools people actually use. Please do not enter anything confidential.</div>'; }
    h+='<div class="nav"><button class="btn" data-act="back"'+(S.step===0?" disabled":"")+'>&larr; Back</button>';
    h+= S.step<4
      ? '<button class="btn dark" data-act="next">Continue &rarr;</button>'
      : '<button class="btn coral" data-act="gen">Generate hiring kit</button>';
    h+='</div>';
  }

  h+='</div>';
  app.innerHTML=h;
}

/* Scenario list: the scenario itself, then the escalation that adds a
   constraint. Plain strings are supported for the few non-scenario prompts. */
function scenarioListHTML(items){
  return '<ul class="qlist">'+items.map(function(it){
    if(typeof it==="string") return '<li>'+esc(it)+'</li>';
    return '<li>'+esc(it.s)+(it.p?'<span class="probe"><b>Go deeper:</b> '+esc(it.p)+'</span>':'')+'</li>';
  }).join("")+'</ul>';
}

function scenarioListMD(items){
  var m="";
  items.forEach(function(it){
    if(typeof it==="string"){ m+="- "+it+"\n"; return; }
    m+="- "+it.s+"\n";
    if(it.p) m+="  - _Go deeper:_ "+it.p+"\n";
  });
  return m;
}

function resultHTML(c,k){
  var h="";
  h+='<div class="note">Built from your choices using the Acuolo content library. '+
     'Copy it below and rework the scenarios in your own words before you run them — they should sound like your company.</div>';

  h+='<div class="fhead"><div class="eyebrow">Hiring Kit</div>'+
     '<div class="ftitle">'+esc(c.company?c.company+" · "+c.role:c.role)+'</div>'+
     '<div class="fmeta">'+esc(c.seniority)+' &middot; '+k.stages.length+'-stage loop &middot; '+k.competencyCount+' competencies assessed</div></div>';

  h+='<p class="intro">'+esc(k.intro)+'</p>';

  if(k.musts.length){
    h+='<div class="checklist"><b class="t">Screening checklist — must-haves</b>'+
       k.musts.map(function(m){return '<div><span class="box"></span><span>'+esc(m)+'</span></div>';}).join("")+
       '<div style="margin-top:8px;color:var(--muted)">If any of these is a no, stop here and send the early rejection. Carrying a known dealbreaker through four stages wastes their time more than yours.</div></div>';
  }

  h+='<div class="checklist" style="background:var(--linen)"><b class="t">How to run a scenario question</b>'+
     '<div style="display:block">Read the scenario out and then stop talking. The silence is doing work — the first thirty seconds of thinking is most of what you came for.<br><br>'+
     'If they ask clarifying questions before answering, that is signal, not stalling. Someone who asks what the constraints are before deciding is showing you exactly what you want to see.<br><br>'+
     'Then use the <b>go deeper</b> line underneath. Every one of them opens the reasoning up rather than closing it down — it asks how they would choose, or what they would need to know, rather than removing the option they just picked. That matters: if a candidate says they would renegotiate the deadline and you reply "the deadline cannot move", you have thrown away the most useful thing they told you. If you only have time for one thing, go deeper on one scenario rather than running a second.<br><br>'+
     'Do not lead. If you find yourself saying "so you would probably...", you have just given them the answer.<br><br>'+
     '<b>One thing worth remembering:</b> the scenarios you choose describe your company to the candidate. A question built around a manager who does not want to hear bad news tells them what it is like to work here, whether or not that is true. Everything in this kit is written as a situation with competing legitimate priorities, not as a test of whether someone will do the wrong thing under pressure. Keep any you add to that standard.</div></div>';

  h+='<div class="h2">The loop</div>';
  h+='<div class="loop">'+k.stages.map(function(s){
    return '<div class="loopstep"><b>'+s.num+'. '+esc(s.name)+'</b><span>'+esc(s.duration)+' · '+esc(s.who)+'</span></div>';
  }).join("")+'</div>';

  k.stages.forEach(function(s){
    h+='<div class="h2">Stage '+s.num+' · '+esc(s.name)+'</div>';
    h+='<div class="stage"><div class="stagemeta">'+esc(s.duration)+' &middot; Run by '+esc(s.who)+'</div>'+
       '<div class="stagepurpose">'+esc(s.purpose)+'</div>';

    if(s.core){
      h+='<div class="qc"><div class="qcname">'+esc(s.core.name)+'</div>'+
         '<div class="qcdef">'+esc(s.core.note)+'</div>'+
         scenarioListHTML(s.core.sc||s.core.q||s.core.guidance)+'</div>';
    }

    s.competencies.forEach(function(cp){
      h+='<div class="qc"><div class="qcname">'+esc(cp.name)+'</div><div class="qcdef">'+esc(cp.definition)+'</div>'+
         scenarioListHTML(cp.scenarios)+
         '<div class="sig"><b class="good">Strong signal:</b> '+cp.strong.map(esc).join(" · ")+'<br>'+
         '<b class="bad">Weak signal:</b> '+cp.weak.map(esc).join(" · ")+'</div>'+
         '<div class="scale">'+RATING.map(function(r){return '<span class="pill">'+r[0]+' · '+r[1]+'</span>';}).join("")+'</div></div>';
    });

    if(s.valueQuestions.length){
      h+='<div class="qc"><div class="qcname">Values alignment</div>'+
         '<div class="qcdef">Assessed against your stated values, not against culture fit.</div>'+
         scenarioListHTML(s.valueQuestions)+
         '<div class="scale">'+RATING.map(function(r){return '<span class="pill">'+r[0]+' · '+r[1]+'</span>';}).join("")+'</div></div>';
    }

    if(s.closing.length){
      h+='<div class="qc"><div class="qcname">Scope &amp; motivation</div>'+
         '<div class="qcdef">Not scored. This is where you find out whether the role is big enough to keep them.</div>'+
         scenarioListHTML(s.closing)+
         '<div class="sig"><b class="good">Worth noticing:</b> what they ask you about tells you what they actually care about. No questions at all is itself an answer.</div></div>';
    }
    h+='</div>';
  });

  h+='<div class="h2">Making the decision</div>';
  h+='<div class="rubric"><b class="t">Debrief rules</b><ul>'+
     '<li>Everyone submits their scores <b>before</b> the debrief, not during. The first person to speak otherwise sets the anchor for the room.</li>'+
     '<li>The scale has no neutral option on purpose. There is no "maybe": 2 is a no and 3 is a yes, and choosing between them is exactly the judgement you are being asked for.</li>'+
     '<li>Any score of 1 on a competency gets discussed properly, even if every other score is high. One serious gap in the wrong area outweighs an even spread.</li>'+
     '<li>Disagreement between interviewers is information, not a problem to average away. Ask what one person saw that the other did not.</li>'+
     '<li>Nobody is allowed to say "culture fit" without naming the specific behaviour behind it. Unexamined, it is where bias goes to hide.</li>'+
     '<li>The bar is "clearly better than the alternative of leaving it open" — not "the best of the people we happened to see."</li>'+
     '</ul></div>';

  if(k.emails.length){
    h+='<div class="h2">Email templates</div>';
    var lastGroup="";
    k.emails.forEach(function(e){
      if(e.group!==lastGroup){
        h+='<div style="font-size:12px;color:var(--light);text-transform:uppercase;letter-spacing:.4px;margin:16px 0 8px">'+esc(e.group)+'</div>';
        lastGroup=e.group;
      }
      h+='<div class="email"><div class="emailname">'+esc(e.name)+'</div>'+
         '<div class="emailwhen">'+esc(e.when)+'</div>'+
         '<div class="emailsubj"><b>Subject:</b> '+esc(e.subj)+'</div>'+
         '<div class="emailbody">'+esc(e.body)+'</div></div>';
    });
    h+='<div class="rubric" style="margin-top:8px"><b class="t">One rule for all of these</b>'+
       'Anything in [square brackets] must be replaced before sending. A candidate who receives "[specific thing they did]" learns exactly how much attention they got.</div>';
  }

  h+='<div class="acts"><button class="btn dark" data-act="copy">'+(S.copied?"Copied":"Copy kit (Markdown)")+'</button>'+
     '<button class="btn" data-act="restart">Start over</button></div>';

  h+='<div class="studio"><b>This is the process on paper.</b>'+
     '<p>Kits like this fall apart in inboxes — scorecards arrive after the debrief, candidates go quiet, nobody can remember who said what. Studio builds the process as a system that actually holds the structure you just designed.</p>'+
     '<a href="/products/studio">See what Studio builds &rarr;</a></div>';
  return h;
}

/* ============================ MARKDOWN ============================ */
function toMarkdown(c,k){
  var m="# Hiring Kit - "+(c.company?c.company+" - ":"")+c.role+"\n";
  m+="_"+c.seniority+" | "+k.stages.length+"-stage loop | "+k.competencyCount+" competencies_\n\n";
  m+=k.intro+"\n\n";

  if(k.musts.length){
    m+="## Screening checklist - must-haves\n";
    k.musts.forEach(function(x){ m+="- [ ] "+x+"\n"; });
    m+="\nIf any of these is a no, stop here and send the early rejection.\n\n";
  }

  m+="## How to run a scenario question\n";
  m+="- Read the scenario out, then stop talking. The silence is doing work.\n";
  m+="- Clarifying questions before answering are signal, not stalling.\n";
  m+="- Always use the 'go deeper' line. Each one opens the reasoning up rather than closing it down - it asks how they would choose, not which option is now forbidden. If a candidate says they would renegotiate the deadline, do not reply that the deadline cannot move; you would be throwing away the most useful thing they said.\n";
  m+="- If time is short, go deeper on one scenario rather than running a second.\n";
  m+="- Do not lead. If you catch yourself saying \"so you would probably...\", you have given them the answer.\n";
  m+="- Remember the scenarios describe your company to the candidate. A question built around a manager who does not want to hear bad news tells them what it is like to work here. Everything here is written as competing legitimate priorities, not as a test of whether someone will do the wrong thing under pressure. Keep any you add to that standard.\n\n";

  m+="## The loop\n";
  k.stages.forEach(function(s){ m+=s.num+". **"+s.name+"** - "+s.duration+", run by "+s.who+"\n"; });
  m+="\n";

  k.stages.forEach(function(s){
    m+="## Stage "+s.num+": "+s.name+"\n";
    m+="_"+s.duration+" | Run by "+s.who+"_\n\n"+s.purpose+"\n\n";
    if(s.core){
      m+="### "+s.core.name+"\n_"+s.core.note+"_\n\n";
      m+=scenarioListMD(s.core.sc||s.core.q||s.core.guidance);
      m+="\n";
    }
    s.competencies.forEach(function(cp){
      m+="### "+cp.name+"\n_"+cp.definition+"_\n\n";
      m+=scenarioListMD(cp.scenarios);
      m+="\nStrong signal: "+cp.strong.join(" / ")+"\n";
      m+="Weak signal: "+cp.weak.join(" / ")+"\n";
      m+="Score: 1 Strong no | 2 No | 3 Yes | 4 Strong yes\n\n";
    });
    if(s.valueQuestions.length){
      m+="### Values alignment\n";
      m+=scenarioListMD(s.valueQuestions);
      m+="\nScore: 1 Strong no | 2 No | 3 Yes | 4 Strong yes\n\n";
    }
    if(s.closing.length){
      m+="### Scope & motivation\n_Not scored._\n\n";
      m+=scenarioListMD(s.closing);
      m+="\nWhat they ask you about tells you what they actually care about.\n\n";
    }
  });

  m+="## Making the decision\n";
  m+="- Everyone submits scores before the debrief, not during.\n";
  m+="- The scale has no neutral option. 2 is a no and 3 is a yes; choosing between them is the judgement.\n";
  m+="- Any score of 1 gets discussed properly, even if every other score is high.\n";
  m+="- Disagreement between interviewers is information, not a problem to average away.\n";
  m+="- Nobody says \"culture fit\" without naming the specific behaviour behind it.\n";
  m+="- The bar is \"clearly better than leaving the role open\", not \"best of who we saw\".\n\n";

  if(k.emails.length){
    m+="## Email templates\n\n";
    var lastGroup="";
    k.emails.forEach(function(e){
      if(e.group!==lastGroup){ m+="### "+e.group+"\n\n"; lastGroup=e.group; }
      m+="**"+e.name+"**\n_"+e.when+"_\n\n";
      m+="Subject: "+e.subj+"\n\n";
      m+=e.body+"\n\n---\n\n";
    });
    m+="Anything in [square brackets] must be replaced before sending.\n";
  }
  return m;
}

/* ============================ NOTIFY (best-effort, never blocks) ============================ */
function notifyBackground(cfg,kit){
  try{
    var payload={
      config:{company:cfg.company,role:cfg.role,seniority:cfg.seniority,loop:cfg.loop,
        values:cfg.values,musts:cfg.musts,emailGroups:cfg.emailGroups,tone:cfg.tone},
      document:toMarkdown(cfg,kit)
    };
    fetch("/api/notify",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)})
      .catch(function(){});
  }catch(e){}
}

/* ============================ STEP TRANSITION ============================ */
function renderStep(){
  render();
  var card=app.querySelector(".card");
  if(card) card.classList.add("step-anim");
}

/* ============================ EVENTS ============================ */
app.addEventListener("input",function(e){
  if(e.target.id==="company") S.cfg.company=e.target.value;
  if(e.target.id==="values")  S.cfg.values=e.target.value;
  if(e.target.id==="musts")   S.cfg.musts=e.target.value;
});

app.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]"); if(!b) return;
  var act=b.getAttribute("data-act"),k=b.getAttribute("data-k"),v=b.getAttribute("data-v");

  if(act==="set"){
    if(k==="autoComp") S.cfg[k]=!!v;
    else S.cfg[k]=v;
    render();
  }
  else if(act==="tog"){
    var a=S.cfg[k],i=a.indexOf(v);
    if(i>-1) a.splice(i,1); else a.push(v);
    render();
  }
  else if(act==="next"){ S.step++; renderStep(); window.scrollTo({top:0,behavior:"smooth"}); }
  else if(act==="back"){ S.step--; renderStep(); window.scrollTo({top:0,behavior:"smooth"}); }
  else if(act==="gen"){ S.kit=buildKit(S.cfg); S.step=5; renderStep(); window.scrollTo({top:0,behavior:"smooth"}); notifyBackground(S.cfg,S.kit); }
  else if(act==="restart"){ S.step=0; S.kit=null; S.copied=false; renderStep(); window.scrollTo({top:0,behavior:"smooth"}); }
  else if(act==="copy"){
    var txt=toMarkdown(S.cfg,S.kit);
    var done=function(){ S.copied=true; render(); setTimeout(function(){S.copied=false;render();},1800); };
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(done,function(){fallbackCopy(txt);done();});
    } else { fallbackCopy(txt); done(); }
  }
});

function fallbackCopy(t){
  var ta=document.createElement("textarea");
  ta.value=t; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try{document.execCommand("copy");}catch(err){}
  document.body.removeChild(ta);
}

render();
</script>
